<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Flux Backup</title>
<style nonce="__CSP_NONCE__">
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,#dceaff 0,transparent 33%),#f4f7fb}.card{width:min(100%,460px);background:#fff;border:1px solid #e3e9f1;border-radius:22px;box-shadow:0 22px 70px #273c6320;padding:34px}.brand{display:flex;gap:12px;align-items:center;font-weight:750;font-size:18px}.mark{display:grid;place-items:center;width:38px;height:38px;background:#245cf2;color:#fff;border-radius:11px;font-size:21px}h1{font-size:30px;letter-spacing:-.04em;margin:34px 0 8px}p{color:#68768d;line-height:1.55;margin:0 0 25px}.step{font-size:12px;color:#71809a;text-transform:uppercase;letter-spacing:.1em;font-weight:750;margin:22px 0 8px}textarea,input{width:100%;border:1px solid #d6dfeb;border-radius:11px;background:#f9fbfe;color:#21314b;padding:12px;font:inherit;font-size:14px;outline:none}textarea{resize:vertical;min-height:110px}input:focus,textarea:focus{border-color:#245cf2;box-shadow:0 0 0 3px #245cf21a}button{cursor:pointer;border:0;border-radius:11px;padding:12px 15px;font:inherit;font-weight:650}button.primary{width:100%;color:#fff;background:#245cf2;margin-top:18px}button.secondary{background:#edf2fb;color:#2452c5;margin-top:9px}button.wallet{width:100%;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:12px;color:#7a879b;margin-top:10px}.error{color:#b42332;background:#fff0f1;border-radius:9px;padding:10px;margin-top:14px;display:none}.error.visible{display:block}.spacer{height:10px}
</style></head><body><main class="card"><div class="brand"><span class="mark">↗</span> Flux Backup</div><h1>Admin sign in</h1><p>Sign a one-time message with an approved Flux or Ethereum wallet to view backup operations.</p><div class="step">1 · Sign this message</div><textarea id="message" readonly aria-label="Message to sign"></textarea><div class="row"><span class="hint">Expires in five minutes</span><button class="secondary" id="copy" type="button">Copy message</button></div><button class="secondary wallet" id="zelcore" type="button">Open Zelcore to sign</button><div id="walletStatus" class="hint" role="status"></div><div class="step">2 · Enter wallet details</div><input id="address" aria-label="Wallet address" autocomplete="off" placeholder="Wallet address"><div class="spacer"></div><textarea id="signature" aria-label="Wallet signature" placeholder="Paste the signed message signature"></textarea><button class="primary" id="login" type="button">Sign in</button><div id="error" class="error" role="alert"></div><div class="hint">Your wallet never shares its private key with this service.</div></main>
<script nonce="__CSP_NONCE__">
let challenge;
const error=document.getElementById('error');
function showError(message){error.textContent=message;error.classList.add('visible')}
async function getChallenge(){try{const response=await fetch('/admin/api/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!response.ok)throw Error('Please wait before requesting another challenge.');challenge=await response.json();document.getElementById('message').value=challenge.message;document.getElementById('signature').value=''}catch(e){showError(e.message)}}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('message').value);document.getElementById('copy').textContent='Copied'}catch(e){document.getElementById('message').select()}};
document.getElementById('zelcore').onclick=async()=>{if(!challenge||Date.now()>challenge.expires)await getChallenge();if(!challenge)return;document.getElementById('walletStatus').textContent='Waiting for Zelcore signature…';const link='zel:?action=sign&message='+encodeURIComponent(challenge.message)+'&icon='+encodeURIComponent('https://raw.githubusercontent.com/runonflux/flux/master/zelID.svg')+'&callback='+encodeURIComponent(location.origin+'/admin/api/wallet-callback');location.href=link;const id=challenge.id,token=challenge.pollToken;const timer=setInterval(async()=>{if(Date.now()>challenge.expires){clearInterval(timer);document.getElementById('walletStatus').textContent='Signature request expired. Refresh and try again.';return}try{const response=await fetch('/admin/api/wallet-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pollToken:token}),cache:'no-store'});if(response.status===429)return;const data=await response.json();if(data.ok){clearInterval(timer);location.replace('/admin/')}}catch(e){}},2000)};
document.getElementById('login').onclick=async()=>{error.classList.remove('visible');const button=document.getElementById('login');button.disabled=true;try{if(!challenge||Date.now()>challenge.expires){await getChallenge();throw Error('The message expired. Sign the new one and try again.')}const response=await fetch('/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id:challenge.id,address:document.getElementById('address').value.trim(),signature:document.getElementById('signature').value.trim()})});const data=await response.json();if(!response.ok)throw Error(data.error||'Sign in failed');location.replace('/admin/')}catch(e){showError(e.message);await getChallenge()}finally{button.disabled=false}};
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')getChallenge();else{showError('Open this page over HTTPS to sign in.');document.getElementById('login').disabled=true;document.getElementById('zelcore').disabled=true}
</script></body></html>
